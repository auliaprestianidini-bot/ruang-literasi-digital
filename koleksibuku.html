/* Navbar */

nav a:hover{

/* Logo Section */
.logo-section{

    gap:20px;
    padding:20px;
    padding-left:40px;
}

.logo-wrapper{
    width:140px;
    height:140px;
    border-radius:50%;

    align-items:center;
    justify-content:center;

    box-shadow:

}

.logo-wrapper img{
    width:130px;
    height:130px;
    border-radius:50%;
    object-fit:contain;
}

/* Judul */

.judul{
text-align:center;
padding:50px 20px 30px;
position:relative;
z-index:2;
}

.judul h1{
font-size:45px;
color:#003566;
}

.judul p{
font-size:18px;
color:#1d3557;
margin-top:10px;
}

/* Search & Filter */
.search-filter-section{
text-align:center;
margin:20px auto;
}

#searchInput, #kategoriFilter{
padding:12px 15px;
border:2px solid #ddd;
border-radius:15px;
font-size:16px;
transition:0.3s;
margin:10px;
}

#searchInput{
width:80%;
max-width:500px;
}

#kategoriFilter{
width:auto;
min-width:250px;
}

#searchInput:focus, #kategoriFilter:focus{
outline:none;
border-color:#667eea;
box-shadow:0 0 10px rgba(102, 126, 234, 0.3);
}

/* Awan */

.cloud{
position:absolute;
background:white;
border-radius:100px;
opacity:0.9;
}

.cloud:before,
.cloud:after{
content:"";
position:absolute;
background:white;
border-radius:50%;
}

.cloud1{
width:140px;
height:50px;
top:90px;
animation:awan 35s linear infinite;
}

.cloud1:before{
width:60px;
height:60px;
top:-30px;
left:20px;
}

.cloud1:after{
width:70px;
height:70px;
top:-35px;
right:20px;
}

.cloud2{
width:170px;
height:60px;
top:180px;
animation:awan 50s linear infinite;
animation-delay:-10s;
}

.cloud2:before{
width:70px;
height:70px;
top:-30px;
left:30px;
}

.cloud2:after{
width:80px;
height:80px;
top:-40px;
right:20px;
}

.cloud3{
width:130px;
height:50px;
top:300px;
animation:awan 42s linear infinite;
}

.cloud3:before{
width:55px;
height:55px;
top:-25px;
left:15px;
}

.cloud3:after{
width:60px;
height:60px;
top:-30px;
right:15px;
}

.cloud4{
width:180px;
height:60px;
top:420px;
animation:awan 55s linear infinite;
}

.cloud4:before{
width:70px;
height:70px;
top:-30px;
left:20px;
}

.cloud4:after{
width:80px;
height:80px;
top:-40px;
right:25px;
}

@keyframes awan{
from{
left:-250px;
}
to{
left:110%;
}
}

/* Glitter */

.glitter{
position:fixed;
width:4px;
height:4px;
background:white;
border-radius:50%;
box-shadow:
0 0 8px white,
0 0 15px white,
0 0 25px white;
animation:kelapkelip 2s infinite alternate;
z-index:1;
}

@keyframes kelapkelip{
from{
opacity:0.2;
transform:scale(0.8);
}
to{
opacity:1;
transform:scale(1.5);
}
}

/* Buku Container */

.container{
width:90%;
max-width:1200px;
margin:auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;
padding-bottom:60px;
position:relative;
z-index:2;
}

/* Book Card */
.book{
background:rgba(255,255,255,0.95);
padding:20px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
transition:0.4s;
display:flex;
flex-direction:column;
overflow:hidden;
}

.book:hover{
transform:translateY(-8px);
box-shadow:0 15px 35px rgba(0,0,0,0.2);
}

.book img{
width:100%;
height:280px;
object-fit:cover;
border-radius:15px;
margin-bottom:15px;
}

.book h3{
color:#003566;
margin-bottom:15px;
font-size:1.1rem;
line-height:1.4;
flex-grow:1;
}

.book-buttons{
display:flex;
gap:10px;
}

.book button{
flex:1;
padding:12px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:bold;
transition:0.3s;
font-size:14px;
}

.book button:first-of-type{
background:#4cc9f0;
color:white;
}

.book button:last-of-type{
background:#003566;
color:white;
}

.book button:hover{
transform:scale(1.04);
opacity:0.9;
}

/* Empty State */
.empty-message{
text-align:center;
grid-column:1 / -1;
padding:60px 20px;
color:#003566;
font-size:1.2rem;
}

.judul h1{

#searchInput{

#kategoriFilter{

grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:15px;

.book{
padding:15px;
}

.book img{
height:200px;
}

.book h3{
font-size:0.95rem;
}

.book button{
font-size:12px;
padding:10px;
}
}

</style>

function tampilkanBuku(){
let cari = document.getElementById("searchInput").value.toLowerCase();
let kategori = document.getElementById("kategoriFilter").value;
let html = "";

buku.forEach(item=>{
let cocokJudul = item.judul.toLowerCase().includes(cari);
let cocokKategori = kategori==="semua" || item.kategori===kategori;

if(cocokJudul && cocokKategori){
html += `
<div class="book">
<img src="${item.cover}" alt="${item.judul}" onerror="this.src='https://via.placeholder.com/280x350?text=${encodeURIComponent(item.judul)}'">
<h3>${item.judul}</h3>
<div class="book-buttons">
<button onclick="simpanBuku('${item.judul.replace(/'/g, "\\'")}')">💾 Simpan</button>
<button onclick="bukaBuku('${item.file}')">📖 Baca</button>
</div>
</div>
`;
}
});

if(html === ""){
html = "<div class='empty-message'>📚 Tidak ada buku yang sesuai dengan pencarian Anda</div>";
}

document.getElementById("daftarBuku").innerHTML = html;
}

document.getElementById("searchInput").addEventListener("keyup", tampilkanBuku);
document.getElementById("kategoriFilter").addEventListener("change", tampilkanBuku);

tampilkanBuku();

<script>

function bukaBuku(file){
window.open(file,"_blank");
}

function simpanBuku(judul){
let rak = JSON.parse(localStorage.getItem("rakBuku")) || [];

if(!rak.includes(judul)){
rak.push(judul);
localStorage.setItem("rakBuku",JSON.stringify(rak));
alert("✅ Buku '" + judul + "' berhasil disimpan ke rak!");
}else{
alert("⚠️ Buku sudah ada di rak.");
}
}

</script>
