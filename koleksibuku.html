*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{min-height:100vh;overflow-x:hidden;background:linear-gradient(180deg,#dff6ff 0%,#ffffff 45%,#5da9e9 75%,#003566 100%);}
nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,0.9);backdrop-filter:blur(10px);padding:18px;text-align:center;box-shadow:0 2px 15px rgba(0,0,0,0.1);}
nav a{text-decoration:none;color:#003566;font-weight:bold;margin:0 20px;font-size:18px;transition:0.3s;}
nav a:hover{color:#0077b6;}
.logo-section{display:flex;align-items:center;gap:20px;padding:20px;padding-left:40px;}
.logo-wrapper{width:140px;height:140px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(255,255,255,0.3) 40%, rgba(77,166,255,0.2));box-shadow:0 0 30px rgba(77,166,255,0.6),0 0 60px rgba(77,166,255,0.4),inset -2px -2px 8px rgba(0,0,0,0.1),inset 2px 2px 8px rgba(255,255,255,0.8);}
.logo-wrapper img{width:130px;height:130px;border-radius:50%;object-fit:contain;}
.judul{text-align:center;padding:50px 20px 30px;position:relative;z-index:2;}
.judul h1{font-size:45px;color:#003566;}
.judul p{font-size:18px;color:#1d3557;margin-top:10px;}
.search-filter-section{text-align:center;margin:20px auto;}
#searchInput,#kategoriFilter{padding:12px 15px;border:2px solid #ddd;border-radius:15px;font-size:16px;transition:0.3s;margin:10px;}
#searchInput{width:80%;max-width:500px;}
#kategoriFilter{width:auto;min-width:250px;}
#searchInput:focus,#kategoriFilter:focus{outline:none;border-color:#667eea;box-shadow:0 0 10px rgba(102, 126, 234, 0.3);}
.cloud{position:absolute;background:white;border-radius:100px;opacity:0.9;}
.cloud:before,.cloud:after{content:"";position:absolute;background:white;border-radius:50%;}
.cloud1{width:140px;height:50px;top:90px;animation:awan 35s linear infinite;}
.cloud1:before{width:60px;height:60px;top:-30px;left:20px;}
.cloud1:after{width:70px;height:70px;top:-35px;right:20px;}
.cloud2{width:170px;height:60px;top:180px;animation:awan 50s linear infinite;animation-delay:-10s;}
.cloud2:before{width:70px;height:70px;top:-30px;left:30px;}
.cloud2:after{width:80px;height:80px;top:-40px;right:20px;}
.cloud3{width:130px;height:50px;top:300px;animation:awan 42s linear infinite;}
.cloud3:before{width:55px;height:55px;top:-25px;left:15px;}
.cloud3:after{width:60px;height:60px;top:-30px;right:15px;}
.cloud4{width:180px;height:60px;top:420px;animation:awan 55s linear infinite;}
.cloud4:before{width:70px;height:70px;top:-30px;left:20px;}
.cloud4:after{width:80px;height:80px;top:-40px;right:25px;}
@keyframes awan{from{left:-250px;}to{left:110%;}}
