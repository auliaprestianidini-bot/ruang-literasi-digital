*{

}

body{
min-height:100vh;

180deg,
#dff6ff 0%,
#ffffff 45%,
#5da9e9 75%,

);

/* Navbar */

nav{
position:sticky;
top:0;
z-index:100;
background:rgba(255,255,255,0.9);
backdrop-filter:blur(10px);
padding:18px;
text-align:center;
box-shadow:0 2px 15px rgba(0,0,0,0.1);
}

nav a{
text-decoration:none;
color:#003566;
font-weight:bold;
margin:0 20px;
font-size:18px;
transition:0.3s;
}

nav a:hover{
color:#0077b6;

/* Logo Section */
.logo-section{
    display:flex;
    align-items:center;
    gap:20px;
    padding:20px;
    padding-left:40px;
}

.logo-wrapper{
    width:140px;
    height:140px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(255,255,255,0.3) 40%, rgba(77,166,255,0.2));
    box-shadow:
        0 0 30px rgba(77,166,255,0.6),
        0 0 60px rgba(77,166,255,0.4),
        inset -2px -2px 8px rgba(0,0,0,0.1),
        inset 2px 2px 8px rgba(255,255,255,0.8);
}

.logo-wrapper img{
    width:130px;
    height:130px;
    border-radius:50%;
    object-fit:contain;
}

/* Judul */

.judul{
text-align:center;
padding:50px 20px 30px;
position:relative;
z-index:2;
}

.judul h1{
font-size:45px;
color:#003566;
}

.judul p{
font-size:18px;
color:#1d3557;
margin-top:10px;
}

/* Awan */

.cloud{
position:absolute;
background:white;
border-radius:100px;
opacity:0.9;
}

.cloud:before,
.cloud:after{
content:"";
position:absolute;
background:white;
border-radius:50%;
}

.cloud1{
width:140px;
height:50px;
top:90px;
animation:awan 35s linear infinite;
}

.cloud1:before{
width:60px;
height:60px;
top:-30px;
left:20px;
}

.cloud1:after{
width:70px;
height:70px;
top:-35px;
right:20px;
}

.cloud2{
width:170px;
height:60px;
top:180px;
animation:awan 50s linear infinite;
animation-delay:-10s;
}

.cloud2:before{
width:70px;
height:70px;
top:-30px;
left:30px;
}

.cloud2:after{
width:80px;
height:80px;
top:-40px;
right:20px;
}

.cloud3{
width:130px;
height:50px;
top:300px;
animation:awan 42s linear infinite;
}

.cloud3:before{
width:55px;
height:55px;
top:-25px;
left:15px;
}

.cloud3:after{
width:60px;
height:60px;
top:-30px;
right:15px;
}

.cloud4{
width:180px;
height:60px;
top:420px;
animation:awan 55s linear infinite;
}

.cloud4:before{
width:70px;
height:70px;
top:-30px;
left:20px;
}

.cloud4:after{
width:80px;
height:80px;
top:-40px;
right:25px;
}

@keyframes awan{
from{
left:-250px;
}
to{
left:110%;
}
}

/* Glitter */

.glitter{
position:fixed;
width:4px;
height:4px;
background:white;
border-radius:50%;
box-shadow:
0 0 8px white,
0 0 15px white,
0 0 25px white;
animation:kelapkelip 2s infinite alternate;
}

@keyframes kelapkelip{
from{
opacity:0.2;
transform:scale(0.8);
}
to{
opacity:1;
transform:scale(1.5);
}
}

/* Buku */

.container{
width:90%;
max-width:1200px;
margin:auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;
padding-bottom:60px;
position:relative;
z-index:2;
}

.book{
background:rgba(255,255,255,0.9);
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
transition:0.4s;
}

.book:hover{
transform:translateY(-8px);
}

.book h3{
color:#003566;
margin-bottom:20px;
}

.book button{
width:100%;
padding:12px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:bold;
margin-top:10px;
transition:0.3s;
}

.book button:first-of-type{
background:#4cc9f0;
color:white;
}

.book button:last-of-type{
background:#003566;
color:white;
}

.book button:hover{
transform:scale(1.04);
}

</style>

function tampilkanBuku(){

let cari =
document.getElementById("searchInput").value.toLowerCase();

let kategori =
document.getElementById("kategoriFilter").value;

let html = "";

buku.forEach(item=>{

let cocokJudul =
item.judul.toLowerCase().includes(cari);

let cocokKategori =
kategori==="semua" ||
item.kategori===kategori;

if(cocokJudul && cocokKategori){

html += `
<div class="book">

<img src="${item.cover}"
style="width:100%;height:280px;object-fit:cover;border-radius:15px;">

<h3>${item.judul}</h3>

<button onclick="simpanBuku('${item.judul}','${item.file}')">
Simpan ke Rak
</button>

<button onclick="bukaBuku('${item.file}')">
📖 Baca Buku
</button>

</div>
`;

}

});

document.getElementById("daftarBuku").innerHTML = html;

}

document.getElementById("searchInput")
.addEventListener("keyup", tampilkanBuku);

document.getElementById("kategoriFilter")
.addEventListener("change", tampilkanBuku);

tampilkanBuku();

<script>

function bukaBuku(file){
window.open(file,"_blank");
}

function simpan(judul){

let rak = JSON.parse(localStorage.getItem("rakBuku")) || [];

if(!rak.includes(judul)){
rak.push(judul);
localStorage.setItem("rakBuku",JSON.stringify(rak));
alert("Buku berhasil disimpan ke rak!");
}else{
alert("Buku sudah ada di rak.");
}

}

</script>
