<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rak Buku - Ruang Literasi</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    background:linear-gradient(
        to bottom,
        #bde9ff 0%,
        #ffffff 45%,
        #1d4e89 100%
    );
    position:relative;
}

/* Logo */
.logo-kiri{
    position:fixed;
    top:15px;
    left:20px;
    width:75px;
    height:75px;
    border-radius:50%;
    object-fit:cover;
    background:white;
    padding:4px;
    box-shadow:0 0 15px rgba(255,255,255,0.9);
    z-index:1000;
}

/* Navbar */
nav{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(255,255,255,0.9);
    backdrop-filter:blur(10px);
    padding:12px 30px;
    border-radius:50px;
    box-shadow:0 4px 15px rgba(0,0,0,0.15);
    z-index:1000;
}

nav a{
    text-decoration:none;
    color:#1d4e89;
    font-weight:600;
    margin:0 15px;
    transition:0.3s;
}

nav a:hover{
    color:#4da8ff;
}

/* Awan */
.cloud{
    position:absolute;
    background:white;
    border-radius:100px;
    opacity:0.9;
    z-index:1;
}

.cloud::before{
    content:"";
    position:absolute;
    width:90px;
    height:90px;
    background:white;
    border-radius:50%;
    top:-40px;
    left:40px;
}

.cloud::after{
    content:"";
    position:absolute;
    width:110px;
    height:110px;
    background:white;
    border-radius:50%;
    top:-50px;
    right:35px;
}

.cloud1{
    width:280px;
    height:90px;
    top:160px;
    left:-350px;
    animation:awan 70s linear infinite;
}

@keyframes awan{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(2000px);
    }
}

/* Glitter */
.glitter{
    position:absolute;
    width:4px;
    height:4px;
    background:white;
    border-radius:50%;
    box-shadow:
        0 0 5px white,
        0 0 10px white,
        0 0 15px white;
    animation:kelapkelip 2s infinite alternate;
}

@keyframes kelapkelip{
    from{
        opacity:0.3;
        transform:scale(0.7);
    }
    to{
        opacity:1;
        transform:scale(1.5);
    }
}

/* Hero */
.hero{
    text-align:center;
    padding-top:150px;
    position:relative;
    z-index:2;
}

.hero h1{
    font-size:3rem;
    color:#0d3b66;
    text-shadow:
        0 0 10px rgba(255,255,255,0.9),
        0 0 20px rgba(255,255,255,0.8),
        0 0 30px rgba(77,168,255,0.5);
}

.hero p{
    margin-top:12px;
    color:#234;
    font-size:1.1rem;
}

/* Rak Buku */
.rak-container{
    display:flex;
    justify-content:center;
    padding:60px 20px 40px;
    position:relative;
    z-index:2;
}

.rak{
    width:90%;
    max-width:1100px;
}

.lantai{
    height:20px;
    background:#7a4b2f;
    border-radius:10px;
    margin:55px 0;
    box-shadow:0 6px 12px rgba(0,0,0,0.25);
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:12px;
    padding-bottom:15px;
}

.buku{
    width:50px;
    border-radius:5px 5px 0 0;
    box-shadow:2px 2px 5px rgba(0,0,0,0.25);
    transition:0.3s;
}

.buku:hover{
    transform:translateY(-8px);
}

.b1{height:120px;background:#ff6b6b;}
.b2{height:90px;background:#4dabf7;}
.b3{height:110px;background:#51cf66;}
.b4{height:140px;background:#845ef7;}
.b5{height:100px;background:#fcc419;}
.b6{height:130px;background:#ff922b;}
.b7{height:115px;background:#f06595;}
.b8{height:95px;background:#20c997;}

/* Daftar Rak Buku */
.daftarRak-container{
    background:rgba(255,255,255,0.95);
    border-radius:15px;
    padding:30px;
    margin:40px auto;
    max-width:900px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    position:relative;
    z-index:2;
}

.daftarRak-container h2{
    color:#0d3b66;
    margin-bottom:20px;
    text-align:center;
}

.daftarRak-list{
    list-style:none;
}

.daftarRak-list li{
    padding:15px;
    margin:10px 0;
    background:linear-gradient(135deg, #4cc9f0 0%, #0096c7 100%);
    color:white;
    border-radius:8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 4px 8px rgba(0,0,0,0.1);
    transition:0.3s;
}

.daftarRak-list li:hover{
    transform:translateX(5px);
    box-shadow:0 6px 12px rgba(0,0,0,0.2);
}

.daftarRak-list li span{
    flex:1;
    font-weight:500;
}

.daftarRak-list li div{
    display:flex;
    gap:8px;
}

.daftarRak-list li div button{
    background:rgba(255,255,255,0.3);
    border:none;
    color:white;
    padding:8px 15px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
    font-size:0.9rem;
    display:flex;
    align-items:center;
    gap:5px;
}

.daftarRak-list li div button:hover{
    background:rgba(255,255,255,0.6);
    transform:scale(1.05);
}

.kosong{
    text-align:center;
    color:#666;
    padding:40px;
    font-style:italic;
    font-size:1.1rem;
}

.kosong-icon{
    font-size:3rem;
    margin-bottom:15px;
}

/* Footer */
.footer{
    text-align:center;
    color:white;
    padding:30px;
    font-size:14px;
    position:relative;
    z-index:2;
}

/* Responsive */
@media(max-width:768px){
    .hero h1{
        font-size:2rem;
    }
    
    nav{
        padding:10px 20px;
        font-size:0.9rem;
    }
    
    nav a{
        margin:0 10px;
    }
    
    .daftarRak-list li{
        flex-direction:column;
        align-items:flex-start;
        gap:10px;
    }
    
    .daftarRak-list li div{
        width:100%;
    }
    
    .daftarRak-list li div button{
        flex:1;
        justify-content:center;
    }
}
</style>
</head>

<body>

<!-- Logo -->
<img src="ppliterasi.jpeg" class="logo-kiri" alt="Logo Literasi">

<!-- Navbar -->
<nav>
    <a href="beranda.html">Beranda</a>
    <a href="koleksibuku.html">Koleksi Buku</a>
    <a href="rakbuku.html">Rak Buku</a>
</nav>

<!-- Awan -->
<div class="cloud cloud1"></div>

<!-- Glitter -->
<script>
for(let i=0;i<50;i++){
    let glitter=document.createElement('div');
    glitter.classList.add('glitter');

    glitter.style.left=Math.random()*100+'%';
    glitter.style.top=Math.random()*100+'%';

    glitter.style.animationDuration=
    (Math.random()*3+1)+'s';

    document.body.appendChild(glitter);
}
</script>

<!-- Judul -->
<section class="hero">
    <h1>📚 Rak Buku Literasi</h1>
    <p>Jelajahi berbagai koleksi bacaan untuk menambah wawasan dan pengetahuan.</p>
</section>

<!-- Rak Buku -->
<div class="rak-container">
    <div class="rak">

        <div class="lantai">
            <div class="buku b1"></div>
            <div class="buku b2"></div>
            <div class="buku b3"></div>
            <div class="buku b4"></div>
            <div class="buku b5"></div>
            <div class="buku b6"></div>
            <div class="buku b7"></div>
            <div class="buku b8"></div>
        </div>

        <div class="lantai">
            <div class="buku b8"></div>
            <div class="buku b7"></div>
            <div class="buku b6"></div>
            <div class="buku b5"></div>
            <div class="buku b4"></div>
            <div class="buku b3"></div>
            <div class="buku b2"></div>
            <div class="buku b1"></div>
        </div>

        <div class="lantai">
            <div class="buku b3"></div>
            <div class="buku b5"></div>
            <div class="buku b7"></div>
            <div class="buku b2"></div>
            <div class="buku b8"></div>
            <div class="buku b4"></div>
            <div class="buku b1"></div>
            <div class="buku b6"></div>
        </div>

    </div>
</div>

<!-- Daftar Buku yang Disimpan -->
<div class="daftarRak-container">
    <h2>📖 Buku Saya</h2>
    <div id="daftarRak"></div>
</div>

<div class="footer">
    © 2026 Ruang Literasi Digital
</div>

<!-- Script -->
<script>

// Data buku untuk referensi (sama seperti di koleksibuku.html)
const bukuDatabase = [
{judul:"Milea Suara Dari Dilan",file:"milea.pdf"},
{judul:"Catatan Harian Menantu Sinting",file:"absurd.pdf"},
{judul:"Bukan Jodohnya yang Tak Kunjung Datang",file:"bukanjodohnya.pdf"},

{judul:"Tentang Kamu",file:"tentangkamu.pdf"},
{judul:"Gigi Koko",file:"gigikoko.pdf"},
{judul:"Delapan Enam",file:"delapanenam.pdf"},
{judul:"23:59 Sebuah Novel Brian",file:"novelbrian.pdf"},
{judul:"Syahadat Cinta",file:"syahadatcinta.pdf"},
{judul:"Daun Yang Jatuh Tak Pernah Membenci Angin",file:"daun.pdf"},
{judul:"Sungguh Kau Boleh Pergi",file:"boleh.pdf"},
{judul:"Hujan",file:"hujan.pdf"},
{judul:"101 Kesalahan Dalam Mendidik Anak",file:"salinan101kesalahandalammendidikanak.pdf"},
{judul:"Menggali Potensi Anak Sejak Dini",file:"potensia.pdf"},
{judul:"3 Menit Membuat Anak Keranjingan Belajar",file:"cendekia.pdf"},
{judul:"1001 Cara Bicara Orang Tua Kepada Remaja",file:"jembatan.pdf"},
{judul:"Aneka Makanan dan Minuman untuk Mencerdaskan Otak Bayi",file:"goldenia.pdf"},
{judul:"Kajian Dampak Penggunaan Media Sosial bagi Anak dan Remaja",file:"remajanet.pdf"},
{judul:"Baca Buku Ini Saat Engkau Gagal",file:"lentera.pdf"},
{judul:"Aristoteles Inspirasi dan Pencerahan Hidup untuk Lebih Bermakna",file:"aristoteles.pdf"},
{judul:"Membaca Ekspresi Wajah",file:"mimika.pdf"},
{judul:"Gak Capek Dituntut Mulu",file:"gakcapekdituntutmulu.pdf"},
{judul:"Dark Psychology",file:"dark.pdf"},
{judul:"Nanti Juga Sembuh Sendiri",file:"nantijugasembuhsendiri.pdf"},
{judul:"Bilang Begini Maksudnya Begitu",file:"bilangbeginimaksudnyabegitu.pdf"},
{judul:"Rahasia Magnet Rezeki",file:"rahasiamagnetrezeki.pdf"},
{judul:"Berdamai dengan Rasa Malas",file:"berdamaidenganrasamalas.pdf"},
{judul:"Emotional Intelligence Itu DIPRAKTEKIN",file:"etonial.pdf"},
{judul:"Self Knowledge",file:"self.pdf"},
{judul:"Sebuah Seni untuk Bersikap Bodo Amat",file:"sebuahseniuntukbersikapbodoamat.pdf"},
{judul:"Seni Berbicara kepada Siapa, Kapan Saja, di Mana Saja",file:"seniberbicara.pdf"},
{judul:"Dasar-Dasar Manajemen Pendidikan",file:"manajemen.pdf"},
{judul:"Kewirausahaan",file:"kewirausahaan.pdf"},
{judul:"Pemasaran",file:"pemasaran.pdf"},
{judul:"Strategi Promosi Pemasaran",file:"strategipromosi.pdf"},
{judul:"Influencer Digital Marketing",file:"influencerdigitalmarket.pdf"},
{judul:"10 Strategi Manajemen Terdahsyat di Dunia",file:"manajemen10strategi.pdf"},
{judul:"The Psychology of Money",file:"money.pdf"},
{judul:"Bisnis Ala Nabi",file:"bisnis.pdf"},
{judul:"Orang Kaya di Negeri Miskin",file:"orangkayadinegerimiskin.pdf"},
{judul:"Buku Sakti Excel untuk Bisnis dan Perkantoran",file:"bukusaktiexcel.pdf"},
{judul:"Desain Grafis",file:"desaingrafis.pdf"},
{judul:"5 Hari Jago Desain UI UX",file:"jagodesain.pdf"},
{judul:"Teknik Mahir Berbicara di Depan Publik",file:"berbicara.pdf"},
{judul:"Buku Ajar Anatomi",file:"anatomi.pdf"},
{judul:"Ilmu Kesehatan Masyarakat",file:"kesehatan.pdf"},
{judul:"Mengenal Kesehatan Jiwa",file:"mengenalkesehatanjiwa.pdf"},
{judul:"Studi Filsafat 1",file:"filsafat1.pdf"},
{judul:"Studi Filsafat 2",file:"filsafat2.pdf"},
{judul:"Madilog",file:"madilog.pdf"},
{judul:"La Tahzan",file:"latahzan.pdf"},
{judul:"Fihi Ma Fihi",file:"fihimafihi.pdf"},
{judul:"Dhammacitta 7 Langkah",file:"7langkah.pdf"},
{judul:"Cut Muthia Rekayasa Genetika",file:"rekayasa.pdf"},
{judul:"Neraka di Warung Kopi",file:"nerakadiwarungkopi.pdf"},
{judul:"Kuliah Itu Enggak Penting",file:"kuliahituenggakpenting.pdf"}
];

// Fungsi untuk mendapatkan file dari judul buku
function getFileFromJudul(judul){
    const buku = bukuDatabase.find(b => b.judul === judul);
    return buku ? buku.file : null;
}

function bukaBuku(file){
    if(file){
        window.open(file,"_blank");
    }
}

function tampilkanRakBuku(){
    let rak = JSON.parse(localStorage.getItem("rakBuku")) || [];
    let daftarRak = document.getElementById("daftarRak");
    
    daftarRak.innerHTML = "";
    
    if(rak.length === 0){
        daftarRak.innerHTML = '<div class="kosong"><div class="kosong-icon">📚</div><p>Belum ada buku yang disimpan.<br>Kunjungi Koleksi Buku untuk menambahkan!</p></div>';
        return;
    }
    
    let ul = document.createElement("ul");
    ul.className = "daftarRak-list";
    
    rak.forEach((judulBuku, index) => {
        let file = getFileFromJudul(judulBuku);
        let li = document.createElement("li");
        li.innerHTML = `
            <span><strong>${index + 1}.</strong> ${judulBuku}</span>
            <div>
                <button onclick="bukaBuku('${file}')">📖 Baca</button>
                <button onclick="hapusBuku(${index})">❌ Hapus</button>
            </div>
        `;
        ul.appendChild(li);
    });
    
    daftarRak.appendChild(ul);
}

function hapusBuku(index){
    let rak = JSON.parse(localStorage.getItem("rakBuku")) || [];
    let bukuDihapus = rak[index];
    rak.splice(index, 1);
    localStorage.setItem("rakBuku", JSON.stringify(rak));
    tampilkanRakBuku();
    alert("✅ Buku '" + bukuDihapus + "' berhasil dihapus dari rak!");
}

// Tampilkan rak buku saat halaman dimuat
document.addEventListener("DOMContentLoaded", tampilkanRakBuku);

// Refresh otomatis setiap kali tab/window aktif kembali
window.addEventListener("focus", tampilkanRakBuku);

</script>

</body>
</html
